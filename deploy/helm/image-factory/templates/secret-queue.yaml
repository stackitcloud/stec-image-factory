{{- if and .Values.queue.enabled (not .Values.queue.existingSecret) }}
{{- $url := .Values.queue.url }}
{{- if and (not $url) .Values.demo.rabbitmq.enabled }}
{{- $url = printf "amqp://%s:%s@%s-rabbitmq:5672/" .Values.demo.rabbitmq.username .Values.demo.rabbitmq.password (include "image-factory.fullname" .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "image-factory.fullname" . }}-queue
  namespace: {{ include "image-factory.namespace" . }}
  labels:
    {{- include "image-factory.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ $url | required "queue.url, queue.existingSecret or demo.rabbitmq.enabled is required when queue.enabled is set." | quote }}
{{- end }}
